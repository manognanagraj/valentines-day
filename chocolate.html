<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chocolate Day 🍫</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #6f4e37, #c89f94);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pacifico', cursive;
      color: white;
      overflow: hidden;
      position: relative;
    }

    /* Floating chocolates */
    .choco {
      position: absolute;
      top: -10%;
      animation: fall linear infinite;
      opacity: 0.7;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(120vh) rotate(360deg);
      }
    }

    .card {
      background: rgba(255,255,255,0.2);
      padding: 30px 24px;
      border-radius: 24px;
      max-width: 440px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      z-index: 2;
    }

    h1 {
      font-size: 2.1rem;
      margin-bottom: 20px;
    }

    .poem {
      font-family: 'Quicksand', sans-serif;
      font-size: 1.25rem;
      line-height: 1.7;
      margin: 20px 0;
    }

    .image img {
      width: 90%;
      max-width: 320px;
      margin: 20px auto;
      display: block;
      border-radius: 16px;
    }

    .love-note {
      text-align: right;
      font-family: 'Quicksand', sans-serif;
      font-size: 1rem;
      margin-top: 10px;
      opacity: 0.9;
    }

    button {
      padding: 12px 28px;
      border-radius: 30px;
      border: none;
      font-size: 1rem;
      margin: 10px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .yes {
      background-color: #4e342e;
      color: white;
    }

    .no {
      background-color: white;
      color: #4e342e;
      position: absolute;
    }
  </style>
</head>

<body>

  <!-- First screen -->
  <div class="card" id="start">
    <h1>I have something sweet for you… 🍫</h1>
    <button class="yes" onclick="showChocolate()">YES 🤎</button>
    <button class="no" id="noBtn">NO 🙈</button>
  </div>

  <script>
    /* NO button runs away */
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      noBtn.style.top = Math.random() * 80 + "vh";
      noBtn.style.left = Math.random() * 80 + "vw";
    });

    /* Show Chocolate Day content */
    function showChocolate() {
      document.body.innerHTML = `
        <div class="card">
          <h1>Happy Chocolate Day 🍫</h1>

          <div class="poem">
            Chocolate is sweet,<br>
            but you’re sweeter than that,<br>
            you turn my worst days<br>
            into smiles just like that.<br><br>

            Some chocolates melt,<br>
            but you always stay true,<br>
            everything sweet reminds me of you —<br>
            especially when it’s <b>you</b>, mannuuu 🤎🍫
          </div>

          <div class="image">
            <img src="chocolate.jpeg" alt="Cute couple sharing chocolate">
          </div>

          <div class="love-note">
            always yours 🤎
          </div>
        </div>
      `;
    }

    /* Floating chocolates */
    setInterval(() => {
      const choco = document.createElement("div");
      choco.classList.add("choco");
      choco.innerText = "🍫";
      choco.style.left = Math.random() * 100 + "vw";
      choco.style.fontSize = Math.random() * 1.4 + 0.8 + "rem";
      choco.style.animationDuration = Math.random() * 5 + 6 + "s";
      document.body.appendChild(choco);

      setTimeout(() => choco.remove(), 12000);
    }, 450);
  </script>

</body>
</html>
