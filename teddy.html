<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teddy Day 🧸</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Comic+Neue:ital,wght@1,700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #f7c8b6, #fce1d8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pacifico', cursive;
      color: #5a3e36;
      overflow: hidden;
      position: relative;
    }

    /* Floating icons */
    .float {
      position: absolute;
      top: -10%;
      font-size: 1.5rem;
      opacity: 0.7;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(120vh) rotate(360deg);
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.6);
      padding: 28px 22px;
      border-radius: 25px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      z-index: 2;
    }

    h1 {
      font-size: 2.1rem;
      margin-bottom: 15px;
    }

    .poem {
      font-family: 'Comic Neue', cursive;
      font-size: 1.3rem;
      line-height: 1.7;
      margin: 20px 0;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s;
      font-family: 'Pacifico', cursive;
    }

    .yes {
      background-color: #c97c5d;
      color: white;
    }

    .no {
      background-color: white;
      color: #c97c5d;
      position: relative;
    }

    button:hover {
      transform: scale(1.1);
    }

    .teddy-img {
      width: 80%;
      max-width: 280px;
      margin: 20px auto;
      display: block;
    }

    .love-note {
      text-align: right;
      font-family: 'Comic Neue', cursive;
      font-size: 1.1rem;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- Start Card -->
  <div class="card" id="startCard">
    <h1>Ready for a warm hug… or are you scared? 🧸😌</h1>
    <button class="yes" onclick="showSurprise()">YES 🧸💗</button>
    <button class="no" id="noBtn">NO 🙈</button>
  </div>

  <script>
    function showSurprise() {
      document.body.innerHTML = `
        <div class="card">
          <h1>Happy Teddy Day 🧸💞</h1>

          <div class="poem">
            If comfort had a face,<br>
            it would look like you.<br>
            Calm in my chaos,<br>
            my safe place too.<br><br>

            If I could, I’d send you a teddy<br>
            as big as my love —<br>
            until then, let this page hug you for me,<br>
            my teddy bear 🤎🧸
          </div>

          <img src="teddy.jpeg" alt="Cute Teddy" class="teddy-img">

          <div class="love-note">
            with all my cuddles ❤️
          </div>
        </div>
      `;
    }

    /* NO button teasing */
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      noBtn.style.position = "absolute";
      noBtn.style.top = Math.random() * 80 + "%";
      noBtn.style.left = Math.random() * 80 + "%";
    });

    /* Floating hearts & teddies */
    setInterval(() => {
      const float = document.createElement("div");
      float.classList.add("float");
      float.innerText = Math.random() > 0.5 ? "🧸" : "💗";
      float.style.left = Math.random() * 100 + "vw";
      float.style.animationDuration = Math.random() * 5 + 6 + "s";
      float.style.fontSize = Math.random() * 1.2 + 0.8 + "rem";
      document.body.appendChild(float);

      setTimeout(() => float.remove(), 12000);
    }, 350);
  </script>

</body>
</html>
