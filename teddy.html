<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teddy Day 🧸</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Comic+Neue:ital@1&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f7c59f, #fce1c7);
      font-family: 'Pacifico', cursive;
      color: #6b3e26;
      overflow-x: hidden;
      position: relative;
      padding: 30px 0;
    }

    /* Floating icons */
    .float {
      position: fixed;
      top: -10%;
      font-size: 1.6rem;
      opacity: 0.7;
      animation: fall linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes fall {
      to {
        transform: translateY(120vh) rotate(360deg);
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.7);
      padding: 28px 22px;
      border-radius: 24px;
      max-width: 460px;
      width: 90%;
      margin: auto;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      backdrop-filter: blur(10px);
      z-index: 1;
      position: relative;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
    }

    .poem {
      font-family: 'Comic Neue', cursive;
      font-style: italic;
      font-size: 1.25rem;
      line-height: 1.8;
      margin: 25px 0;
    }

    .teddy-img img {
      width: 85%;
      max-width: 300px;
      margin: 20px auto;
      display: block;
      border-radius: 18px;
    }

    .love-note {
      text-align: right;
      font-family: 'Comic Neue', cursive;
      font-style: italic;
      font-size: 1.1rem;
      margin-top: 15px;
    }

    button {
      padding: 12px 22px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 10px;
      background: #a47148;
      color: white;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .no {
      background: #fff;
      color: #a47148;
      position: absolute;
    }
  </style>
</head>

<body>

  <!-- Start card -->
  <div class="card" id="startCard">
    <h1>Are you ready for a teddy-sized hug? 🧸😏</h1>
    <button onclick="showSurprise()">YESSS 🤎</button>
    <button class="no" id="noBtn">NO 🙈</button>
  </div>

  <script>
    function showSurprise() {
      document.body.innerHTML = `
        <div class="card">
          <h1>Happy Teddy Day 🧸</h1>

          <div class="poem">
            You are my comfort on tired days,<br>
            my calm in every stormy way.<br>
            If I could, I’d send you a teddy so tight,<br>
            it’d hug you through the longest night.<br><br>

            Until then, let this page do it for me,<br>
            wrapping you in love endlessly.<br>
            My teddy bear, my safest place —<br>
            forever my favorite embrace 🤎
          </div>

          <div class="teddy-img">
            <img src="teddy.jpg" alt="Cute Teddy Couple">
          </div>

          <div class="love-note">
            with love ❤️
          </div>
        </div>
      `;
    }

    /* No button tease */
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      noBtn.style.left = Math.random() * 70 + "%";
      noBtn.style.top = Math.random() * 70 + "%";
    });

    /* Floating hearts & teddies */
    setInterval(() => {
      const icon = document.createElement("div");
      icon.classList.add("float");
      icon.innerText = Math.random() > 0.5 ? "🧸" : "🤎";
      icon.style.left = Math.random() * 100 + "vw";
      icon.style.animationDuration = Math.random() * 5 + 6 + "s";
      document.body.appendChild(icon);

      setTimeout(() => icon.remove(), 12000);
    }, 500);
  </script>

</body>
</html>
