<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teddy Day 🧸</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f6c1a3, #ffe5d0);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Baloo 2', cursive;
      color: #6b3f2b;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating hearts & teddy */
    .float {
      position: absolute;
      top: -10%;
      font-size: 1.6rem;
      opacity: 0.7;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(120vh) rotate(360deg);
      }
    }

    .card {
      background: #fff3ea;
      padding: 30px 22px;
      border-radius: 26px;
      max-width: 460px;
      width: 92%;
      max-height: 90vh;
      overflow-y: auto; /* ✅ scrolling like Chocolate Day */
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      z-index: 2;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2.3rem;
      margin-bottom: 20px;
    }

    .poem {
      font-size: 1.25rem;
      line-height: 1.8;
      margin: 20px 0;
    }

    .image-box img {
      width: 90%;
      max-width: 320px;
      border-radius: 18px;
      margin: 25px auto;
      display: block;
    }

    .love-note {
      text-align: right;
      font-size: 1.1rem;
      margin-top: 10px;
      opacity: 0.9;
    }

    button {
      padding: 12px 26px;
      border-radius: 30px;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      margin: 10px;
      font-family: 'Baloo 2', cursive;
    }

    .yes {
      background: #ff8fab;
      color: white;
    }

    .no {
      background: white;
      color: #ff8fab;
      position: relative;
    }
  </style>
</head>

<body>

  <!-- Start Card -->
  <div class="card" id="startCard">
    <h1>Are you ready for your teddy hug? 🧸😏</h1>
    <button class="yes" onclick="showTeddy()">YES 💕</button>
    <button class="no" id="noBtn">NO 🙈</button>
  </div>

  <script>
    function showTeddy() {
      document.body.innerHTML = `
        <div class="card">
          <h1>Happy Teddy Day 🧸</h1>

          <div class="poem">
            You are my comfort on tired days,<br>
            my calm in every stormy way.<br><br>

            If I could, I’d send you a teddy so tight,<br>
            it’d hug you through the longest night.<br><br>

            Until then, let this page do it for me,<br>
            wrapping you in love endlessly.<br><br>

            My teddy bear, my safest place —<br>
            forever my favorite embrace 🤎
          </div>

          <div class="image-box">
            <img src="teddy.jpeg" alt="Cute Teddy Couple">
          </div>

          <div class="love-note">
            with love ❤️
          </div>
        </div>
      `;
    }

    /* No button runs away */
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      noBtn.style.position = "absolute";
      noBtn.style.top = Math.random() * 80 + "%";
      noBtn.style.left = Math.random() * 80 + "%";
    });

    /* Floating hearts & teddy icons */
    setInterval(() => {
      const el = document.createElement("div");
      el.classList.add("float");
      el.innerText = Math.random() > 0.5 ? "🧸" : "💖";
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = Math.random() * 5 + 6 + "s";
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 12000);
    }, 450);
  </script>

</body>
</html>
