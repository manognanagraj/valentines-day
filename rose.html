<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rose Day 🌹</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff6f91, #ffc1cc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Pacifico', cursive;
      color: white;
      overflow: hidden;
      position: relative;
    }

    /* Floating petals */
    .petal {
      position: absolute;
      top: -50px;
      font-size: 1.5rem;
      opacity: 0.6;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(360deg);
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.18);
      padding: 32px;
      border-radius: 22px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      backdrop-filter: blur(10px);
      z-index: 2;
    }

    h1 {
      font-size: 2.1rem;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 26px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.2s;
    }

    .yes {
      background-color: #ff2e63;
      color: white;
    }

    .no {
      background-color: white;
      color: #ff2e63;
      position: absolute;
    }

    button:hover {
      transform: scale(1.1);
    }

    .poem {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.35rem;
      line-height: 1.8;
      margin: 22px 0;
    }

    .bouquet {
      margin-top: 20px;
    }

    .bouquet img {
      width: 85%;
      max-width: 300px;
    }
  </style>
</head>

<body>

  <!-- Start Card -->
  <div class="card" id="startCard">
    <h1>Are you ready for today’s surprise? 🌹</h1>
    <button class="yes" onclick="showSurprise()">YES 💖</button>
    <button class="no" id="noBtn">NO 🙈</button>
  </div>

  <script>
    /* NO button runs away */
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      noBtn.style.top = Math.random() * 80 + "vh";
      noBtn.style.left = Math.random() * 80 + "vw";
    });

    /* Show poem */
    function showSurprise() {
      document.body.innerHTML = `
        <div class="card">
          <h1>Happy Rose Day 🌹</h1>

          <div class="poem">
            Roses are red,<br>
            violets are blue,<br>
            if I had a whole garden,<br>
            I’d still search for you.<br><br>

            Among every flower,<br>
            pretty and rare,<br>
            my eyes would stop<br>
            only when you’re there.<br><br>

            If love were a garden,<br>
            and choices were few,<br>
            I’d pick you again —<br>
            every time, every view 💖
          </div>

          <div class="bouquet">
            <img src="bouquet.png" alt="Rose Bouquet">
          </div>
        </div>
      `;
    }

    /* Floating rose petals */
    setInterval(() => {
      const petal = document.createElement("div");
      petal.classList.add("petal");
      petal.innerText = "🌸";
      petal.style.left = Math.random() * 100 + "vw";
      petal.style.animationDuration = Math.random() * 5 + 6 + "s";
      document.body.appendChild(petal);

      setTimeout(() => petal.remove(), 12000);
    }, 800);
  </script>

</body>
</html>
