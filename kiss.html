<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiss Day 😘</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #ffc6d9, #fbe7ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Baloo 2', cursive;
      color: #6b2d5c;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating icons */
    .float {
      position: absolute;
      top: -10%;
      font-size: 1.6rem;
      opacity: 0.6;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(120vh) rotate(360deg);
      }
    }

    .card {
      background: #fff0f6;
      padding: 30px 22px;
      border-radius: 28px;
      max-width: 460px;
      width: 92%;
      max-height: 90vh;
      overflow-y: auto;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      z-index: 2;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 2.3rem;
      margin-bottom: 18px;
    }

    .poem {
      font-size: 1.2rem;
      line-height: 1.8;
      margin: 22px 0;
    }

    .image-box img {
      width: 90%;
      max-width: 320px;
      border-radius: 22px;
      margin: 22px auto;
      display: block;
      box-shadow: 0 8px 22px rgba(0,0,0,0.2);
    }

    .love-note {
      text-align: right;
      font-size: 1.05rem;
      margin-top: 10px;
      opacity: 0.9;
    }

    button {
      padding: 12px 26px;
      border-radius: 30px;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      margin: 10px;
      font-family: 'Baloo 2', cursive;
    }

    .yes {
      background: #ff6fae;
      color: white;
    }

    .no {
      background: white;
      color: #ff6fae;
      position: relative;
    }
  </style>
</head>

<body>

  <!-- Start Screen -->
  <div class="card" id="startCard">
    <h1>Just wondering… 😌</h1>
    <p>If I leaned in right now,<br>would you kiss me? 🙈</p>
    <button class="yes" onclick="showKiss()">YES 😘</button>
    <button class="no" id="noBtn">NO 🙈</button>
  </div>

  <script>
    function showKiss() {
      document.body.innerHTML = `
        <div class="card">
          <h1>Happy Kiss Day 😘</h1>

          <div class="poem">
            Some kisses are quick,<br>
            some make time slow,<br>
            but yours feel like<br>
            home, you know?<br><br>

            A smile, a blush,<br>
            hearts racing fast,<br>
            every kiss with you<br>
            feels like my favorite first.<br><br>

            If love had a language,<br>
            it’d sound like this —<br>
            soft laughs, warm breaths,<br>
            sealed with a kiss 💋
          </div>

          <div class="image-box">
            <img src="kiss.jpeg" alt="Cute Kiss Couple">
          </div>

          <div class="love-note">
            with love ❤️
          </div>
        </div>
      `;
    }

    /* No button runs away */
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      noBtn.style.position = "absolute";
      noBtn.style.top = Math.random() * 80 + "%";
      noBtn.style.left = Math.random() * 80 + "%";
    });

    /* Floating kiss & hearts */
    setInterval(() => {
      const el = document.createElement("div");
      el.classList.add("float");
      el.innerText = Math.random() > 0.5 ? "💋" : "💕";
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = Math.random() * 5 + 6 + "s";
      document.body.appendChild(el);

      setTimeout(() => el.remove(), 12000);
    }, 450);
  </script>

</body>
</html>
